[package]
name = "mxbot-common"
version = "0.2.0"
edition = "2021"
description = "Shared Matrix infrastructure for the mxbot fleet"

[features]
default = []
# Forwards matrix-sdk's test helpers for bots whose tests mock a homeserver.
testing = ["matrix-sdk/testing"]
# iCalendar and CalDAV (src/calendar): calendar-bot, plenum-bot.
calendar = ["dep:calcard", "dep:chrono", "dep:chrono-tz", "dep:reqwest", "dep:rrule"]
# The house's directory (src/directory.rs): plenum-bot, cleaning-bot.
directory = ["dep:reqwest"]
# Markdown messages (format::markdown): plenum-bot, health-bot.
markdown = ["dep:pulldown-cmark"]
# Time zone and DST rule (src/clock.rs), scheduled jobs (src/schedule.rs): calendar-bot, radar-bot.
schedule = ["dep:chrono", "dep:chrono-tz"]
# SQLite stores with numbered migrations (src/sqlite.rs): kummerkasten-bot, schnaeppchenjaeger-bot.
sqlite = ["dep:rusqlite"]
# Forward-auth identity and the page language of the bots' websites (src/web.rs):
# cleaning-bot, schnaeppchenjaeger-bot.
web = ["dep:http", "dep:subtle"]

[dependencies]
anyhow             = "1"
# iCalendar reading (time zones, VTIMEZONE, Windows names) and recurrence rules (src/calendar/ics.rs).
calcard            = { version = "0.3", default-features = false, optional = true }
chrono             = { version = "0.4", optional = true }
chrono-tz          = { version = "0.10", optional = true }
rrule              = { version = "0.14", optional = true }
reqwest            = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
futures-util       = "0.3"
# The type of a file sent with `media` (the SDK takes it); already in the tree through matrix-sdk.
mime               = "0.3"
# Request headers of the websites (web); axum's HeaderMap is this one.
http               = { version = "1", optional = true }
pulldown-cmark     = { version = "0.13", default-features = false, features = ["html"], optional = true }
# The one place the fleet's Matrix SDK is defined. The fork copies `m.mentions`
# into the cleartext wrapper of encrypted events (MSC3952) so that mention
# push rules fire in encrypted rooms. Bots use `mxbot_common::matrix_sdk`
# instead of declaring (and patching) the SDK themselves.
matrix-sdk         = { git = "https://github.com/PolynomialDivision/matrix-rust-sdk", branch = "msc3952-mentions-encrypted-0.19", features = ["e2e-encryption", "sqlite", "automatic-room-key-forwarding"] }
matrix-sdk-crypto  = { git = "https://github.com/PolynomialDivision/matrix-rust-sdk", branch = "msc3952-mentions-encrypted-0.19" }
# SQLite stores (sqlite): the version the SDK's sqlite store already links; no bundled build here.
rusqlite           = { version = "0.40", default-features = false, optional = true }
serde              = { version = "1", features = ["derive"] }
# Stable transaction IDs (send::txn_for); the SDK has it already.
sha2               = "0.10"
serde_json         = "1"
# The proxy secret compared in constant time (web); already in the tree through vodozemac.
subtle             = { version = "2.6", optional = true }
# Names unknown config keys (config::load_toml), so a typo does not silently keep a default.
serde_ignored      = "0.1"
tokio              = { version = "1", features = ["fs", "io-util", "macros", "rt", "signal", "sync", "time"] }
toml               = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[[example]]
name = "ics_listing"
required-features = ["calendar"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
